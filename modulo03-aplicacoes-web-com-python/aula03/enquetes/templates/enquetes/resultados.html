<h1>{{ pergunta.texto_pergunta }}</h1>

<ul>
    {% for opcao in pergunta.opcao_set.all %}
        <li>{{ opcao.texto_opcao }} -- {{ opcao.votos }} voto{{ opcao.votos|pluralize }}</li>
    {% endfor %}
</ul>

<a href="{% url "enquetes:detalhes" pergunta.id %}">Votar novamente?</a><br>
