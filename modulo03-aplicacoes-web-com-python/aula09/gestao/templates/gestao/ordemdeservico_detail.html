{% extends "base.html" %}

{% block conteudo %}
    <div class="row mt-2 justify-content-center">
        <div class="col-6 text-center">
            <h2>Detalhes da OS #{{ ordemdeservico.pk }}</h2>
        </div>
    </div>

    <form action="{% url "gestao:atualizacao_ordem_de_servico" ordemdeservico.pk %}" method="POST">

        {% csrf_token %}

        <div class="row mt-3 justify-content-center">
            <div class="col-6">
                <div class="form-floating">
                    <input
                        type="text"
                        name="titulo"
                        id="titulo"
                        class="form-control"
                        placeholder="Título"
                        value="{{ ordemdeservico.titulo }}"
                        >
                    <label for="Título" class="form-label">Título</label>
                </div>
            </div>
        </div>

        <div class="row mt-3 justify-content-center">
            <div class="col-6">
                <div class="form-floating">
                    <textarea
                        name="descricao"
                        id="descricao"
                        rows="20"
                        class="form-control"
                        {% if not ordemdeservico.tecnico %}disabled{% endif %}
                    >{{ ordemdeservico.descricao }}</textarea>
                    <label for="descricao" class="form-label">Descrição</label>
                </div>
            </div>
        </div>

        {% if perms.gestao.pode_visualizar_todas_os %}
            <div class="row mt-3 justify-content-center">
                <div class="col-6">
                    <select
                        name="status"
                        class="form-select"
                        aria-label="Status do Ticket"
                        {% if not ordemdeservico.tecnico %}disabled{% endif %}>
                        {% for chave, status in status_list %}
                            <option
                                value="{{ chave }}" {% if chave == ordemdeservico.status %}selected{% endif %}>{{ status }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
        {% endif %}

        {% if not ordemdeservico.tecnico %}
            <div class="row mt-3 justify-content-center">
                <div class="col-6">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" name="atribuir" id="atribuir">
                        <label class="form-check-label" for="atribuir">
                            Atribuir esse ticket a mim
                        </label>
                    </div>
                </div>
            </div>
        {% endif %}
        
        <div class="row mt-2 justify-content-center">
            <div class="col-3 d-grid">
                <button type="submit" class="btn btn-primary">Enviar</button>
            </div>
        </div>
    </form>
    
{% endblock conteudo %}
